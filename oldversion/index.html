<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TadioPlus Old Version - หน้าหลัก</title>
    <link rel="manifest" href="manifest.json">
    
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #222;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }
        h1 {
            color: #4CAF50;
            font-size: 32px;
            margin-bottom: 30px;
        }
        .menu-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        .menu-button {
            display: block;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #555;
        }
        .menu-button:hover {
            background-color: #4CAF50;
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>TadioPlus</h1>

    <div class="menu-container">
        <a href="https://tadioplus.vercel.app/oldversion/tvonline.html" class="menu-button">ดูทีวีออนไลน์ (TV Online)</a>
        <a href="https://tadioplus.vercel.app/oldversion/radio.html" class="menu-button">ฟังวิทยุ (Radio)</a>
    </div>

    <div class="footer">
        รองรับการทำงานทุกเบราว์เซอร์
    </div>

    <script>
        if (window.navigator && 'serviceWorker' in window.navigator) {
            window.navigator.serviceWorker.register('sw.js')
            .then(function(registration) {
                if (window.console) console.log('Service Worker OK');
            })
            .catch(function(error) {
                if (window.console) console.log('Service Worker Error');
            });
        }
    </script>
</body>
</html>
