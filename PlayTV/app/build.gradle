apply plugin: 'com.android.application'

android {
    namespace 'com.tadiotv.app'
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.tadiotv.app"
        minSdkVersion 17          // Android 4.2 Jelly Bean
        targetSdkVersion 33
        versionCode 3
        versionName "2.1"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE*'
        exclude 'META-INF/NOTICE*'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.multidex:multidex:2.0.1'
    // อัปเดตข้อมูลช่อง + ผังรายการอัตโนมัติทุกวัน
    implementation 'androidx.work:work-runtime:2.7.1'
    // ExoPlayer 2.18.7 รองรับ API 16+ (Media3 ต้อง API 21 ซึ่งจะทำให้ Android 4.2 ใช้ไม่ได้)
    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.7'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.18.7'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.18.7'
}
