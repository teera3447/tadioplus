name: Build APK (PlayTV manual)

on:
  workflow_dispatch:
  # The root workflow builds PlayTV automatically on relevant pushes.
  # Keep this workflow manual-only to avoid duplicate builds.

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.3"

      - name: Set up Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"

      - name: Build debug APK
        run: gradle -p PlayTV assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TadioTV-apk
          path: PlayTV/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
