name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "PlayTV/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 defaults to the obsolete `tools` package, which fails.
          packages: ''

      - name: Install Android SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.3"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"

      - name: Build debug APK
        working-directory: PlayTV
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TadioTV-apk
          path: PlayTV/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
