name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "PlayTV/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # runner มี Android SDK ติดมาแล้ว แค่ยอมรับ license และเตรียม platform/build-tools ที่ใช้
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-33" "build-tools;33.0.2" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > PlayTV/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"

      - name: Build debug APK
        run: gradle -p PlayTV assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TadioTV-apk
          path: PlayTV/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp PlayTV/app/build/outputs/apk/debug/app-debug.apk TadioTV-v2.4.apk
          gh release create "apk-v2.4-run${{ github.run_number }}" TadioTV-v2.4.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "TadioTV v2.4 (debug APK)" \
            --notes "แก้ https บน Android เก่า: แนบใบรับรองรากเพิ่ม"
