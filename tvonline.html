<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tadio+ TV</title>
<link rel="preconnect" href="https://iptv.tadioplus.workers.dev" crossorigin>
<link rel="preconnect" href="https://vjs.zencdn.net" crossorigin>
<link rel="stylesheet" href="https://vjs.zencdn.net/8.10.0/video-js.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9fa;--panel:#fff;--primary:#ff4757;--text:#333;--border:#eee;--icon:#555;--hover:#f1f3f5}
body.dark-mode{--bg:#121212;--panel:#1e1e1e;--text:#eee;--border:#333;--icon:#aaa;--hover:#2a2a2a}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Kanit',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:0 20px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);height:60px;flex-shrink:0;z-index:10}
.logo{font-weight:600;font-size:22px;color:var(--primary);display:flex;align-items:center;gap:10px}
.btn-theme,.btn-back{cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:20px;padding:8px 16px;font:inherit;font-size:14px;display:flex;align-items:center;gap:8px;text-decoration:none}
.btn-theme:hover,.btn-back:hover{background:var(--hover)}
#app{display:flex;flex:1;overflow:hidden}
#player-wrapper{flex:1;background:#000;position:relative}
.video-js{width:100%!important;height:100%!important}
.status-bar{padding:12px 20px;background:var(--bg);font-size:14px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:10px}
#sidebar{width:350px;background:var(--panel);display:flex;flex-direction:column;border-left:1px solid var(--border)}
.search-box{padding:20px 15px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:15px}
.input-group{position:relative}
.input-group i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--icon);pointer-events:none}
.search-box input,.search-box select{width:100%;padding:12px 15px;border-radius:25px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none;font:inherit;font-size:14px}
.search-box input{padding-left:45px}
#channel-list{flex:1;overflow-y:auto;padding:15px}
.channel-item{padding:10px 15px;margin-bottom:10px;border-radius:15px;cursor:pointer;display:flex;align-items:center;gap:15px;border:1px solid var(--border);background:var(--panel);content-visibility:auto;contain-intrinsic-size:0 72px}
.channel-item:hover{border-color:var(--primary)}
.channel-item.is-active{background:var(--primary);color:#fff;border-color:var(--primary)}
.channel-item img{width:50px;height:50px;object-fit:contain;background:#fff;border-radius:10px;padding:5px;flex-shrink:0}
.channel-info{display:flex;flex-direction:column;flex:1;min-width:0}
.channel-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel-category{font-size:11px;color:var(--icon);margin-top:2px}
.channel-item.is-active .channel-category{color:rgba(255,255,255,.8)}
@media(max-width:850px){
  body{overflow-y:auto;height:auto}
  #app{flex-direction:column}
  #player-wrapper{height:56.25vw;min-height:230px;flex:none;position:sticky;top:60px;z-index:100}
  #sidebar{width:100%;border:none}
}
</style>
</head>
<body>
<header>
  <a href="https://tadioplus.vercel.app/" class="btn-back"><i class="fa-solid fa-arrow-left"></i><span>หน้าหลัก</span></a>
  <div class="logo"><i class="fa-solid fa-tv"></i> Tadio+ TV</div>
  <button class="btn-theme" id="theme-btn"><i class="fa-solid fa-moon"></i><span>สลับธีม</span></button>
</header>
<div id="app">
  <div id="player-wrapper">
    <video id="tv-player" class="video-js vjs-theme-fantasy" controls playsinline preload="metadata"></video>
  </div>
  <div id="sidebar">
    <div class="status-bar" id="status"><i class="fa-solid fa-spinner fa-spin"></i> กำลังเตรียมความพร้อม...</div>
    <div class="search-box">
      <div class="input-group">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search" placeholder="ค้นหาชื่อช่องรายการ..." autocomplete="off">
      </div>
      <select id="category"><option value="all">ทุกหมวดหมู่</option></select>
    </div>
    <div id="channel-list"></div>
  </div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://unpkg.com/videojs-hls-quality-selector@2.0.0/dist/videojs-hls-quality-selector.min.js"></script>
<script>
(() => {
  const WORKER = "https://iptv.tadioplus.workers.dev";
  const CACHE_KEY = "tadioplus_tv_cache_v3";
  const THEME_KEY = "tadioplus_theme";
  const BATCH = 60;
  const FALLBACK_LOGO = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50"><rect width="50" height="50" rx="10" fill="#ddd"/><text x="25" y="31" font-size="12" text-anchor="middle" fill="#666">TV</text></svg>'
  );

  const $ = id => document.getElementById(id);
  const statusEl = $("status"), listEl = $("channel-list"), searchEl = $("search"), catEl = $("category"), themeBtn = $("theme-btn");

  let channels = [];   // [{name, url, logo, group, key}]
  let visible = [];
  let renderToken = 0;
  let lastText = null;
  let player = null;

  // ---------- Theme ----------
  function applyTheme(dark) {
    document.body.classList.toggle("dark-mode", dark);
    themeBtn.firstElementChild.className = dark ? "fa-solid fa-sun" : "fa-solid fa-moon";
  }
  applyTheme(localStorage.getItem(THEME_KEY) === "dark");
  themeBtn.addEventListener("click", () => {
    const dark = !document.body.classList.contains("dark-mode");
    localStorage.setItem(THEME_KEY, dark ? "dark" : "light");
    applyTheme(dark);
  });

  // ---------- Player ----------
  // ตั้งค่าเพื่อลดแรมและลดการดาวน์โหลดที่เกินจำเป็น
  function getPlayer() {
    if (player) return player;
    player = videojs("tv-player", {
      fluid: true,
      aspectRatio: "16:9",
      autoplay: false,
      liveui: true,
      html5: {
        vhs: {
          overrideNative: true,
          limitRenditionByPlayerDimensions: true,
          useDevicePixelRatio: false,
          bandwidth: 4000000,
          maxBufferLength: 20,   // วินาที: ไม่เก็บ segment มากเกินไป ประหยัดแรม
          maxMaxBufferLength: 30
        }
      }
    });
    if (typeof player.hlsQualitySelector === "function") {
      player.hlsQualitySelector({ displayCurrentQuality: true });
    }
    return player;
  }

  // ---------- Playlist ----------
  async function loadPlaylist() {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) parse(cached);
    else statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังดึงข้อมูลช่องรายการ...';

    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 10000);
      const res = await fetch(`${WORKER}/list`, { signal: ctrl.signal });
      clearTimeout(t);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      if (text !== cached) {
        try { localStorage.setItem(CACHE_KEY, text); } catch (_) {}
        parse(text);
      }
    } catch (e) {
      console.error(e);
      if (!cached) statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:#e74c3c"></i> เกิดข้อผิดพลาดในการโหลดข้อมูล';
    }
  }

  function parse(text) {
    if (text === lastText) return;
    lastText = text;
    const lines = text.split(/\r?\n/);
    const groups = new Set();
    const out = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line.startsWith("#EXTINF:")) continue;
      const url = (lines[i + 1] || "").trim();
      if (!url.startsWith("http")) continue;
      const comma = line.indexOf(",");
      const name = comma > -1 ? line.slice(comma + 1).trim() : "ไม่ทราบชื่อช่อง";
      const logo = (line.match(/tvg-logo="([^"]+)"/) || [])[1] || "";
      const group = ((line.match(/group-title="([^"]+)"/) || [])[1] || "Other").split(",")[0].trim();
      groups.add(group);
      out.push({ name, url, logo, group, key: name.toLowerCase() });
    }
    channels = out;
    fillCategories(groups);
    applyFilter();
    statusEl.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#2ecc71"></i> พร้อมรับชมทั้งหมด ${channels.length} ช่อง`;
  }

  function fillCategories(groups) {
    const cur = catEl.value || "all";
    const frag = document.createDocumentFragment();
    const all = new Option("ทุกหมวดหมู่", "all");
    frag.appendChild(all);
    [...groups].sort().forEach(g => frag.appendChild(new Option(g, g)));
    catEl.replaceChildren(frag);
    catEl.value = cur;
  }

  // ---------- Rendering ----------
  function renderList(items) {
    const token = ++renderToken;
    visible = items;
    listEl.replaceChildren();
    let i = 0;

    function batch() {
      if (token !== renderToken) return;
      const frag = document.createDocumentFragment();
      const end = Math.min(i + BATCH, items.length);
      for (; i < end; i++) {
        const ch = items[i];
        const div = document.createElement("div");
        div.className = "channel-item";
        div.dataset.index = i;

        const img = document.createElement("img");
        img.loading = "lazy";
        img.decoding = "async";
        img.alt = "";
        img.src = ch.logo || FALLBACK_LOGO;
        img.onerror = () => { img.onerror = null; img.src = FALLBACK_LOGO; };

        const info = document.createElement("div");
        info.className = "channel-info";
        const name = document.createElement("span");
        name.className = "channel-name";
        name.textContent = ch.name;
        const cat = document.createElement("span");
        cat.className = "channel-category";
        cat.textContent = ch.group;

        info.append(name, cat);
        div.append(img, info);
        frag.appendChild(div);
      }
      listEl.appendChild(frag);
      if (i < items.length) requestAnimationFrame(batch);
    }
    batch();
  }

  listEl.addEventListener("click", e => {
    const item = e.target.closest(".channel-item");
    if (!item) return;
    const ch = visible[+item.dataset.index];
    if (ch) play(ch, item);
  });

  function applyFilter() {
    const kw = searchEl.value.trim().toLowerCase();
    const cat = catEl.value;
    renderList(channels.filter(ch => (cat === "all" || ch.group === cat) && ch.key.includes(kw)));
  }

  let searchTimer;
  searchEl.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilter, 200);
  });
  catEl.addEventListener("change", applyFilter);

  // ---------- Playback ----------
  function play(ch, el) {
    const src = ch.url.startsWith("http://")
      ? `${WORKER}/?url=${encodeURIComponent(ch.url)}`
      : ch.url;

    listEl.querySelectorAll(".is-active").forEach(n => n.classList.remove("is-active"));
    el.classList.add("is-active");

    statusEl.innerHTML = '<i class="fa-solid fa-satellite-dish" style="color:var(--primary)"></i> กำลังเล่น: <b></b>';
    statusEl.querySelector("b").textContent = ch.name;

    if (window.innerWidth < 850) window.scrollTo({ top: 0, behavior: "smooth" });

    const p = getPlayer();
    p.src({ src, type: "application/x-mpegURL" });
    p.play().catch(err => console.log("Play blocked:", err));
  }

  loadPlaylist();
})();
</script>
</body>
</html>
